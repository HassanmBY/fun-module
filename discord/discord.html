<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sofadi+One&display=swap"
      rel="stylesheet"
    />
    <script defer src="./discord.js"></script>
    <title>Discord</title>
    <style>
      /* --- RESET & BASICS --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Sofadi One", system-ui;
        color: #dcddde;
        overflow: hidden;
      }

      /* --- COLOR PALETTE --- */
      :root {
        --bg-server-list: #202225;
        --bg-sidebar: #2f3136;
        --bg-chat: #36393f;
        --bg-chat-header: #36393f;
        --bg-message-hover: #32353b;
        --text-muted: #72767d;
        --text-normal: #dcddde;
        --text-interactive: #b9bbbe;
        --text-header: #fff;
        --divider: #2f3136; /* slightly darker than chat */
        --discord-blurple: #5865f2;
        --discord-green: #3ba55c;
      }

      /* --- LAYOUT --- */
      .app-container {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* 1. SERVER LIST (Leftmost) */
      .server-list {
        width: 72px;
        background-color: var(--bg-server-list);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 12px;
        overflow-y: auto;
      }

      .server-icon {
        width: 48px;
        height: 48px;
        background-color: #36393f;
        border-radius: 50%;
        margin-bottom: 8px;
        cursor: pointer;
        transition: border-radius 0.2s, background-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        color: var(--text-normal);
        font-weight: bold;
        font-size: 14px;
      }

      /* The "Discord Hover" Effect (Squircle) */
      .server-icon:hover {
        border-radius: 16px;
        background-color: var(--discord-blurple);
        color: white;
      }

      /* Active/Home Icon styling */
      .server-icon.active {
        border-radius: 16px;
        background-color: var(--discord-blurple);
      }

      /* White pill indicator on the left */
      .server-icon:hover::before {
        content: "";
        position: absolute;
        left: -16px;
        width: 8px;
        height: 20px;
        background: white;
        border-radius: 0 4px 4px 0;
      }

      .separator {
        width: 32px;
        height: 2px;
        background-color: #36393f;
        margin-bottom: 8px;
      }

      /* 2. SIDEBAR (Channels) */
      .sidebar {
        width: 240px;
        background-color: var(--bg-sidebar);
        display: flex;
        flex-direction: column;
      }

      .server-header {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        font-weight: bold;
        color: var(--text-header);
        box-shadow: 0 1px 0 rgba(4, 4, 5, 0.2);
        cursor: pointer;
      }

      .channel-list {
        flex: 1;
        padding: 16px 8px;
        overflow-y: auto;
      }

      .channel-item {
        display: flex;
        align-items: center;
        padding: 6px 8px;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        margin-bottom: 2px;
        font-weight: 500;
      }

      .channel-item:hover {
        background-color: #34373c;
        color: var(--text-interactive);
      }

      .channel-item.active {
        background-color: #393d42;
        color: #fff;
      }

      .hashtag {
        margin-right: 6px;
        font-size: 20px;
        color: var(--text-muted);
      }

      /* User Area at bottom of sidebar */
      .user-area {
        height: 52px;
        background-color: #292b2f;
        padding: 0 8px;
        display: flex;
        align-items: center;
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-image: url("avatars/avatar9.png");
        background-size: cover;
        margin-right: 8px;
        position: relative;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        background: var(--discord-green);
        border: 2px solid #292b2f;
        border-radius: 50%;
        position: absolute;
        bottom: -1px;
        right: -1px;
      }
      .user-info {
        font-size: 12px;
        font-weight: bold;
      }
      .user-discriminator {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: normal;
      }

      /* 3. MAIN CHAT AREA */
      .chat-area {
        flex: 1;
        background-color: var(--bg-chat);
        display: flex;
        flex-direction: column;
        min-width: 0; /* Prevent flex overflow */
      }

      .chat-header {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        box-shadow: 0 1px 0 rgba(4, 4, 5, 0.2);
        color: var(--text-header);
        font-weight: bold;
      }

      .chat-header .hashtag {
        font-size: 24px;
        margin-right: 8px;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Start at bottom like real chat */
      }

      .message {
        display: flex;
        margin-top: 16px; /* Cozy mode spacing */
      }
      .message:hover {
        background-color: #32353b20; /* subtle hover highlight */
      }

      .message-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #7289da; /* classic blurple */
        margin-right: 16px;
        flex-shrink: 0;
      }

      .message-content h4 {
        font-size: 16px;
        font-weight: 500;
        color: #fff;
        margin-bottom: 2px;
      }

      .message-timestamp {
        font-size: 12px;
        color: var(--text-muted);
        margin-left: 8px;
        font-weight: 400;
      }

      .message-text {
        font-size: 16px;
        line-height: 1.375rem;
        color: var(--text-normal);
      }

      /* Input Area */
      .input-area {
        padding: 0 16px 24px;
      }
      .input-box {
        background-color: #40444b;
        border-radius: 8px;
        padding: 12px 16px;
        color: var(--text-muted);
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="server-list">
        <div class="server-icon active">D</div>
        <div class="separator"></div>
        <div
          class="server-icon"
          style="
            background-image: url('servericons/IMG_2670.webp');
            background-size: cover;
          "
        ></div>
        <div
          class="server-icon"
          style="
            background-image: url('https://via.placeholder.com/48/555');
            background-size: cover;
          "
        ></div>
        <div class="server-icon">+</div>
      </div>

      <div class="sidebar">
        <div class="server-header">Send Help</div>
        <div class="channel-list">
          <div class="channel-item active">
            <span class="hashtag">#</span> general
          </div>
          <div class="channel-item"><span class="hashtag">#</span>help-It</div>
          <div class="channel-item">
            <span class="hashtag">#</span> voice-chat
          </div>
        </div>
        <div class="user-area">
          <div class="user-avatar">
            <div class="status-dot"></div>
          </div>
          <div class="user-info">
            <div>The only sane person</div>
            <div class="user-discriminator">#1234</div>
          </div>
        </div>
      </div>

      <div class="chat-area">
        <div class="chat-header"><span class="hashtag">#</span> general</div>
        <div class="messages">
          <!-- Messages go here -->
        </div>
        <div class="input-area">
          <div class="input-box">Message #general</div>
        </div>
      </div>
    </div>
  </body>
</html>
