<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#5865F2" />
		<title>Fun Module PWA</title>
		<link rel="manifest" href="./manifest.json" />
		<link rel="icon" type="image/png" href="./icons/icon-192.png" />

		<style>
			a {
				all: unset;
				background-color: red;
				padding: 1rem;
				border-radius: 1rem;
			}

			html,
			body {
				width: 100vw;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
			}

			.buttons {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 1rem;
			}

			#install-button {
				all: unset;
				background-color: #5865F2;
				color: white;
				padding: 1rem 2rem;
				border-radius: 1rem;
				cursor: pointer;
				font-size: 1rem;
				font-weight: 600;
				transition: background-color 0.2s;
			}

			#install-button:hover {
				background-color: #4752C4;
			}
		</style>
	</head>
	<body>
		<div class="buttons">
			<a href="discord/discord.html">Discord</a>
			<a href="email_page/email.html">Email</a>
		</div>

		<button id="install-button" onclick="installPWA()" style="display: none;">
			📥 Install App
		</button>

		<script src="./scripts/notification-manager.js"></script>
		<script src="./register-sw.js"></script>
	</body>
</html>
